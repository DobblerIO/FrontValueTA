name: deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run build and deploy
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run build
      # - run: do deploy

    